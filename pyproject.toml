[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-segmentation-anomalies"
version = "0.1.0"
description = "Reproducible customer segmentation and anomaly detection for retail transactions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
notebooks = ["ipykernel>=6.29", "jupyterlab>=4.1", "pyarrow>=14"]
deep-learning = ["tensorflow==2.15.*; python_version < '3.12'"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
retail-segment = "retail_segmentation.train:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.packages.find]
where = ["src"]
